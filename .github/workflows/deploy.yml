name: Update Portfolio and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "portfolio-pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download GitHub repositories
        env:
          GITHUB_USERNAME: codebymirela
          GH_TOKEN: ${{ github.token }}

        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/users/$GITHUB_USERNAME/repos?per_page=100&sort=updated&direction=desc&type=owner" \
            > repositories.json

          echo "Repositories downloaded:"
          jq length repositories.json

      - name: Create documentation for new repositories
        run: |
          mkdir -p project-content

          jq -r '
            .[]
            |
            select(
              .fork == false
              and
              .archived == false
              and
              .name != "codebymirela.github.io"
              and
              .name != "codebymirela"
            )
            |
            .name
          ' repositories.json |
          while IFS= read -r repo
          do

            file="project-content/${repo}.md"

            if [ ! -f "$file" ]; then

              echo "Creating documentation: $file"

              cp project-content/_template.md "$file"

              sed -i \
                "s/{{PROJECT_NAME}}/${repo}/g" \
                "$file"

            else

              echo "Documentation already exists: $file"

            fi

          done

      - name: Commit new documentation
        run: |
          if [ -n "$(git status --porcelain project-content)" ]; then

            git config user.name "github-actions[bot]"

            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add project-content

            git commit \
              -m "Create documentation for new repositories"

            git push origin main

          else

            echo "No new documentation files."
          fi

      - name: Generate portfolio project data
        run: |
          mkdir -p data

          jq '
            [
              .[]
              |
              select(
                .fork == false
                and
                .archived == false
                and
                .name != "codebymirela.github.io"
                and
                (.topics | index("portfolio"))
              )
              |
              {
                name,
                description,
                html_url,
                homepage,
                language,
                topics,
                stargazers_count,
                forks_count,
                created_at,
                updated_at,
                pushed_at
              }
            ]
          ' repositories.json > data/projects.json

          echo "Portfolio repositories found:"
          jq length data/projects.json

          echo "Generated projects.json:"
          cat data/projects.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4